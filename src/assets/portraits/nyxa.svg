  <rect width="400" height="500" fill="#4a5363"/>
  <circle cx="200" cy="215" r="150" fill="#545e70"/>
  <!-- dagger hilt at the shoulder -->
  <path d="M300 330 L352 250 L360 256 L310 336 Z" fill="#b8c0cc"/>
  <rect x="286" y="326" width="30" height="10" transform="rotate(-57 301 331)" fill="#6a4a2a"/>
  <!-- the hood: one deep shape -->
  <path d="M40 500 L64 360 L96 200 Q110 84 200 70 Q290 84 304 200 L336 360 L360 500 Z" fill="#262c3a"/>
  <path d="M214 71 Q290 86 304 200 L336 360 L360 500 L236 500 Z" fill="#1d2230"/>
  <path d="M60 500 L300 340 L308 352 L80 500 Z" fill="#4a3a2a"/>
