  <path d="M136 164 Q140 120 200 114 Q260 120 264 164 L270 300 L232 350 L168 350 L130 300 Z" fill="#12151e"/>
  <!-- a face half-seen, and the wrap over the mouth -->
  <path d="M158 170 L242 170 L246 250 L154 250 Z" fill="#7d8898"/>
  <path d="M212 170 L242 170 L246 250 L210 250 Z" fill="#6a7484"/>
  <path d="M146 250 L254 244 L262 314 L200 340 L140 314 Z" fill="#343b4c"/>
  <path d="M212 246 L254 244 L262 314 L206 338 Z" fill="#2b3140"/>
  <!-- pale eyes -->
  <path d="M166 212 L192 216 L192 222 L166 220 Z" fill="#d8f4ff"/>
  <path d="M234 212 L208 216 L208 222 L234 220 Z" fill="#b8dcec"/>
