<title>Theomachy</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root {
    --ground: #12161c;
    --felt: #1b2530;
    --surface: #1a2028;
    --surface-2: #232b35;
    --surface-3: #2b3540;
    --line: #2f3a46;
    --line-soft: #242d37;
    --ink: #e8eaed;
    --ink-dim: #98a3af;
    --ink-faint: #6b7683;

    --verdigris: #4fa89b;
    --verdigris-dim: #2f6b63;
    --gold: #c9a227;
    --gold-dim: #6d5816;

    --harm: #c2564a;
    --mend: #5fa37c;
    --warn: #d08b3a;
    --atk: #3f6f8c;
    --hp: #b83f36;

    --fighter: #6fae53;
    --caster: #5b8fd0;
    --protector: #d9a03a;

    --display: "Marcellus", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--ground);
    color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; min-height: 100%;
  }
  .shell { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 44px; }

  .masthead {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 14px; flex-wrap: wrap; margin-bottom: 14px;
  }
  .wordmark {
    font-family: var(--display); font-size: clamp(21px, 4vw, 28px);
    letter-spacing: 0.11em; text-transform: uppercase; line-height: 1; margin: 0;
  }
  .wordmark span { color: var(--verdigris); }
  .masthead-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }
  .masthead-meta b { color: var(--ink-dim); font-weight: 500; }

  button {
    font-family: var(--sans); font-size: 13px; color: var(--ink);
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 3px; padding: 6px 12px; cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease;
  }
  button:hover:not(:disabled) { background: var(--surface-3); border-color: #3c4855; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--verdigris); outline-offset: 2px; }
  .btn-primary { background: var(--verdigris-dim); border-color: var(--verdigris); color: #eafaf7; font-weight: 600; }
  .btn-primary:hover:not(:disabled) { background: #3b8579; border-color: #63c0b2; }
  .tnum { font-variant-numeric: tabular-nums; }

  /* ================= the table ================= */

  .table {
    display: grid; grid-template-columns: 30px minmax(0, 1fr) 76px;
    gap: 10px; align-items: stretch;
  }

  .arena {
    position: relative;
    background:
      radial-gradient(120% 78% at 50% 50%, #22303d 0%, #161d26 72%, #121820 100%);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 20px 14px 18px;
    display: flex; flex-direction: column; gap: 10px;
    overflow: hidden;
  }
  .arena::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.55); border-radius: 8px;
  }
  .arena.resolving .rank { pointer-events: none; }

  .rank { display: flex; justify-content: center; gap: clamp(8px, 2.4vw, 26px); position: relative; z-index: 2; }

  /* ---- unit ---- */

  .unit {
    position: relative; width: clamp(74px, 18vw, 116px);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none; padding: 0; margin-top: 15px;
    font-family: var(--sans); color: var(--ink);
  }
  .unit.slot-empty { opacity: 0.22; }
  .unit.pickable { cursor: pointer; }

  .medal {
    position: relative; width: 100%; aspect-ratio: 1;
    border-radius: 50%; overflow: visible;
  }
  .medal-art {
    position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
    background: var(--surface-3);
    display: flex; align-items: center; justify-content: center;
    transition: filter 300ms ease;
  }
  .medal-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .monogram {
    font-family: var(--display); font-size: clamp(22px, 5.6vw, 36px);
    color: rgba(10, 14, 19, 0.82); letter-spacing: 0.03em; user-select: none;
  }
  .ph-fighter { background: linear-gradient(158deg, #58873f 0%, #35522a 60%, #21331b 100%); }
  .ph-caster { background: linear-gradient(158deg, #4a6da3 0%, #2d4364 60%, #1d2c42 100%); }
  .ph-protector { background: linear-gradient(158deg, #ae8534 0%, #6d5320 60%, #3f3115 100%); }

  /* role lives in the frame, not in a text chip */
  .medal-ring {
    position: absolute; inset: -3px; border-radius: 50%;
    border: 3px solid var(--role); pointer-events: none;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(0,0,0,0.45);
  }
  .unit.r-fighter { --role: var(--fighter); }
  .unit.r-caster { --role: var(--caster); }
  .unit.r-protector { --role: var(--protector); }

  .unit.pickable:hover .medal-ring { box-shadow: 0 0 0 2px #fff6, 0 0 14px var(--role); }
  .unit.chosen .medal-ring { border-color: #fff; box-shadow: 0 0 0 2px #ffffff88, 0 0 20px #ffffffb0; }
  .unit.targetable { cursor: crosshair; }
  .unit.targetable .medal-ring {
    border-color: var(--harm);
    animation: seek 1.15s ease-in-out infinite;
  }
  @keyframes seek {
    0%, 100% { box-shadow: 0 0 0 1px #0008, 0 0 0 0 rgba(194, 86, 74, 0.55); }
    50% { box-shadow: 0 0 0 1px #0008, 0 0 0 7px rgba(194, 86, 74, 0); }
  }
  .unit.acting .medal-ring { border-color: #fff; box-shadow: 0 0 22px 4px rgba(255, 244, 196, 0.6); }
  .unit.dead .medal-art { filter: grayscale(1) brightness(0.42); }
  .unit.dead .medal-ring { border-color: #3a4450; }
  .unit.dead .nameplate { opacity: 0.4; }

  .pip {
    position: absolute; bottom: -2px; z-index: 3;
    min-width: 22px; height: 20px; padding: 0 4px;
    border-radius: 4px; border: 1px solid rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 12px; font-weight: 600;
    color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }
  .pip-atk { left: -3px; background: var(--atk); }
  .pip-hp { right: -3px; background: var(--hp); }
  .pip-hp.low { background: #e0503f; box-shadow: 0 0 9px rgba(224, 80, 63, 0.75); }

  .nameplate {
    font-family: var(--display); font-size: clamp(10px, 2.2vw, 12.5px);
    letter-spacing: 0.02em; text-align: center; line-height: 1.15;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--ink-dim); margin-top: 2px;
  }

  /* ---- speech-bubble ordinal ---- */

  .bubble {
    position: absolute; top: -17px; left: 50%; transform: translateX(-50%);
    z-index: 5; background: #f2ece0; color: #20242b;
    font-family: var(--mono); font-size: 10.5px; font-weight: 600;
    padding: 1px 7px; border-radius: 9px; white-space: nowrap;
    box-shadow: 0 2px 5px rgba(0,0,0,0.45);
  }
  .bubble::after {
    content: ""; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
    border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-top: 4px solid #f2ece0;
  }
  .bubble.spent { opacity: 0.35; }
  .bubble.now { background: var(--gold); box-shadow: 0 0 14px rgba(201, 162, 39, 0.8); }
  .bubble.sealed { background: #3a4450; color: var(--ink-dim); }
  .bubble.sealed::after { border-top-color: #3a4450; }

  /* ---- committed order badge ---- */

  .queued {
    position: absolute; top: -8px; right: -6px; z-index: 4;
    width: 26px; height: 26px; border-radius: 50%;
    background: #141a22; border: 2px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--gold);
    overflow: hidden;
  }
  .queued.theirs { border-color: var(--verdigris); color: var(--verdigris); }
  .queued img { width: 100%; height: 100%; object-fit: cover; }
  .queued.sealed { border-color: #4a5462; color: var(--ink-faint); }

  /* ---- status glyphs ---- */

  .glyphs { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; min-height: 12px; }
  .glyph {
    width: 15px; height: 15px; border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-family: var(--mono); font-weight: 600;
    border: 1px solid currentColor; background: #0f141b;
  }
  .g-taunt { color: var(--protector); }
  .g-shield, .g-divine-shield, .g-immune { color: var(--caster); }
  .g-dot { color: var(--harm); }
  .g-regen { color: var(--mend); }
  .g-stun { color: var(--warn); }
  .g-attack-buff { color: var(--fighter); }

  /* ---- the ability tray ---- */

  .tray {
    position: relative; z-index: 2;
    min-height: 92px; border-radius: 7px;
    background: linear-gradient(180deg, #1f3a30 0%, #16281f 100%);
    border: 1px solid #2c5347;
    box-shadow: inset 0 1px 0 #3d6d5d, 0 2px 8px rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    gap: clamp(10px, 3vw, 34px); padding: 9px 14px;
  }
  .tray.waiting { background: linear-gradient(180deg, #232b35 0%, #1a2028 100%); border-color: var(--line); }
  .tray-hint {
    font-family: var(--mono); font-size: 11px; color: var(--ink-faint);
    text-align: center; line-height: 1.7; max-width: 46ch;
  }

  .orb-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .orb {
    position: relative; width: clamp(48px, 11vw, 62px); aspect-ratio: 1;
    border-radius: 50%; padding: 0; border: 3px solid #b9963a;
    background: radial-gradient(circle at 34% 28%, #3c5a72 0%, #1d2b38 72%);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; overflow: visible;
    transition: transform 130ms ease, box-shadow 130ms ease;
  }
  .orb img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .orb-mark { font-size: clamp(17px, 4vw, 22px); color: #d8e4ee; text-shadow: 0 1px 3px #000; }
  .orb.ready { box-shadow: 0 0 0 2px #7ce0b5, 0 0 16px rgba(124, 224, 181, 0.45); }
  .orb.ready:hover:not(:disabled) { transform: translateY(-3px) scale(1.06); box-shadow: 0 0 0 2px #fff, 0 0 22px rgba(124, 224, 181, 0.7); }
  .orb[aria-pressed="true"] { transform: translateY(-4px) scale(1.08); box-shadow: 0 0 0 3px var(--gold), 0 0 24px var(--gold); }
  .orb:disabled { cursor: not-allowed; border-color: #5a5f66; filter: grayscale(0.75) brightness(0.62); }

  .orb-speed {
    font-family: var(--mono); font-size: clamp(14px, 3.4vw, 18px); font-weight: 600;
    color: #f0e2b6; text-shadow: 0 1px 3px #000; line-height: 1;
  }
  .orb-speed.muted { color: var(--ink-faint); }
  .cd {
    position: absolute; top: -5px; right: -5px;
    min-width: 20px; height: 20px; padding: 0 3px; border-radius: 4px;
    background: #1b222b; border: 1px solid #8c93a0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 11px; font-weight: 600; color: #cdd5de;
  }

  /* ---- edge strips ---- */

  .strip {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 7px; display: flex; flex-direction: column; align-items: center;
    padding: 8px 0; gap: 7px;
  }
  .history-strip { cursor: pointer; justify-content: flex-start; }
  .history-strip:hover { background: var(--surface-2); }
  .history-glyph { font-size: 15px; color: var(--ink-faint); }
  .history-label {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-faint);
    writing-mode: vertical-rl; text-orientation: mixed;
  }
  .history-strip.open { border-color: var(--verdigris); }
  .history-strip.unread .history-glyph { color: var(--gold); }

  .flank { display: flex; flex-direction: column; gap: 8px; }
  .ready-btn {
    font-family: var(--display); font-size: 14px; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 14px 6px; line-height: 1.15;
    background: linear-gradient(180deg, #d8b53f 0%, #a8821c 100%);
    border: 1px solid #f0d97a; color: #22190a; font-weight: 600;
    border-radius: 7px; cursor: pointer;
  }
  .ready-btn:hover:not(:disabled) { background: linear-gradient(180deg, #ecc94f 0%, #bd9422 100%); }
  .ready-btn:disabled {
    background: var(--surface-2); border-color: var(--line); color: var(--ink-faint); opacity: 1;
  }

  .bench-strip { flex: 1; }
  .bench-title {
    font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .bench-medal {
    width: 36px; height: 36px; border-radius: 50%; overflow: hidden;
    border: 2px solid var(--role, var(--line)); position: relative;
  }
  .bench-medal .monogram { font-size: 14px; }
  .bench-medal.fallen { filter: grayscale(1) brightness(0.4); border-color: #3a4450; }
  .bench-medal.r-fighter { --role: var(--fighter); }
  .bench-medal.r-caster { --role: var(--caster); }
  .bench-medal.r-protector { --role: var(--protector); }

  /* ---- secondary controls ---- */

  .under-table {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap; margin-top: 9px;
  }
  .turn-note { font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); }
  .mini-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .mini-actions button { font-size: 11.5px; padding: 4px 9px; }
  .mode-toggle { display: flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .mode-toggle button {
    border: none; border-radius: 0; font-family: var(--mono); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.08em; padding: 5px 8px;
    background: transparent; color: var(--ink-faint);
  }
  .mode-toggle button[aria-pressed="true"] { background: var(--surface-3); color: var(--ink); }

  /* ---- tooltip ---- */

  #tip {
    position: fixed; z-index: 90; max-width: 264px; pointer-events: none;
    background: #10151c; border: 1px solid var(--gold-dim); border-radius: 5px;
    padding: 9px 11px; box-shadow: 0 8px 26px rgba(0,0,0,0.6);
    opacity: 0; transition: opacity 110ms ease;
  }
  #tip.on { opacity: 1; }
  .tip-head { display: flex; align-items: baseline; gap: 7px; margin-bottom: 4px; }
  .tip-name { font-family: var(--display); font-size: 14.5px; letter-spacing: 0.02em; }
  .tip-speed { font-family: var(--mono); font-size: 11px; color: var(--verdigris); margin-left: auto; }
  .tip-text { font-size: 12px; color: var(--ink-dim); line-height: 1.45; }
  .tip-meta {
    font-family: var(--mono); font-size: 9.5px; color: var(--ink-faint);
    text-transform: uppercase; letter-spacing: 0.06em; margin-top: 5px;
    padding-top: 5px; border-top: 1px solid var(--line-soft);
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .tip-fore { font-family: var(--mono); font-size: 11px; margin-top: 5px; color: var(--ink-dim); }
  .tip-fore b { color: #e0776a; }
  .tip-fore i { color: var(--warn); font-style: normal; }

  /* ---- history drawer ---- */

  #drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: min(330px, 86vw);
    background: #131920; border-right: 1px solid var(--line); z-index: 80;
    padding: 16px 15px; overflow-y: auto;
    transform: translateX(-102%); transition: transform 220ms ease;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
  }
  #drawer.open { transform: translateX(0); }
  .drawer-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; margin-bottom: 11px;
  }
  .drawer-title {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .round-block { margin-bottom: 13px; }
  .round-tag {
    font-family: var(--mono); font-size: 10px; color: var(--gold);
    letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px;
  }
  .round-lines { margin: 0; padding: 0; list-style: none; font-family: var(--mono); font-size: 11px; line-height: 1.65; }
  .round-lines li { color: var(--ink-dim); }
  .c-damage { color: #d98077; }
  .c-death { color: var(--harm); font-weight: 600; }
  .c-heal, .c-status { color: var(--mend); }
  .c-denied, .c-fizzle { color: var(--warn); }
  .c-taunt { color: var(--protector); }
  .c-cast { color: var(--ink); }

  /* ---- effects ---- */

  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 70; overflow: hidden; }
  .num {
    position: absolute; transform: translate(-50%, -50%);
    font-family: var(--mono); font-weight: 600; font-size: 25px;
    text-shadow: 0 2px 6px #000, 0 0 12px rgba(0,0,0,0.8);
  }
  .num.dmg { color: #ff8f7d; }
  .num.crit { color: #ffd166; font-size: 31px; }
  .num.heal { color: #86e0ab; }
  .num.word { font-size: 14px; color: #cfd8e2; letter-spacing: 0.06em; text-transform: uppercase; }
  .bolt { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); }
  .ripple {
    position: absolute; border-radius: 50%; transform: translate(-50%, -50%);
    border: 2px solid currentColor; pointer-events: none;
  }

  /* ================= draft ================= */

  .draft-grid { display: grid; grid-template-columns: minmax(0, 1fr) 306px; gap: 22px; align-items: start; }
  .eyebrow {
    font-family: var(--mono); font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.14em; color: var(--ink-faint); margin: 0 0 9px;
  }
  .legend {
    display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
    font-family: var(--mono); font-size: 11px; color: var(--ink-dim);
    background: var(--surface); border: 1px solid var(--line-soft);
    border-radius: 5px; padding: 9px 11px; margin-bottom: 15px;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid currentColor; }
  .l-fighter { color: var(--fighter); }
  .l-caster { color: var(--caster); }
  .l-protector { color: var(--protector); }
  .legend-note { color: var(--ink-faint); }

  .pantheon-block { margin-bottom: 16px; }
  .pantheon-name {
    font-family: var(--display); font-size: 13.5px; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--ink-dim); margin: 0 0 8px;
    padding-bottom: 4px; border-bottom: 1px solid var(--line-soft);
  }
  .god-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .god-pick {
    display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 9px; align-items: center;
    text-align: left; padding: 6px 8px; background: var(--surface);
    border: 1px solid var(--line-soft); border-radius: 5px;
  }
  .god-pick:hover:not(:disabled) { background: var(--surface-2); }
  .god-pick:disabled { opacity: 0.62; }
  .god-pick[aria-pressed="true"] { border-color: var(--gold); background: #23231a; }
  .disc {
    width: 38px; height: 38px; border-radius: 50%; overflow: hidden;
    border: 2px solid var(--role, var(--line)); position: relative; flex-shrink: 0;
  }
  .disc.r-fighter { --role: var(--fighter); }
  .disc.r-caster { --role: var(--caster); }
  .disc.r-protector { --role: var(--protector); }
  .disc .monogram { font-size: 15px; }
  .god-pick-name { font-family: var(--display); font-size: 13.5px; }
  .god-pick-stats { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); display: flex; gap: 8px; }
  .god-pick-stats b { color: var(--ink-dim); font-weight: 500; }

  .roster-panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 5px;
    padding: 13px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px);
  }
  .slot-list { display: flex; flex-direction: column; gap: 4px; margin: 0 0 11px; padding: 0; list-style: none; }
  .party-slot {
    display: grid; grid-template-columns: 18px 30px minmax(0, 1fr) auto; gap: 7px; align-items: center;
    background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 3px; padding: 4px 7px;
  }
  .party-slot.bench { background: transparent; border-style: dashed; }
  .party-slot .disc { width: 30px; height: 30px; }
  .party-slot .disc .monogram { font-size: 12px; }
  .slot-index { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); text-align: center; }
  .slot-name-d { font-family: var(--display); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

<div class="shell">
  <header class="masthead">
    <h1 class="wordmark">Theo<span>machy</span></h1>
    <div class="masthead-meta" id="meta"></div>
  </header>
  <main id="stage"></main>
  <p class="footnote" id="footnote"></p>
</div>
<div id="drawer" hidden></div>
<div id="tip" hidden></div>
<div id="fx"></div>

<script type="module">
import * as E from './engine.js';

/* ==================================================================
 * ART MANIFEST
 *
 * Drop images into web/art/ and list them here. Anything without an
 * entry renders a monogram placeholder in its role colour, so the
 * board stays readable while art is still being made. Explicit rather
 * than convention-based on purpose: a missing file costs a
 * placeholder, not a failed request per card.
 *
 *   PORTRAITS.zeus = 'art/zeus.webp';                          // 512x512
 *   ABILITY_ICONS.thunderbolt = 'art/ability/thunderbolt.webp'; //  96x96
 *
 * Portraits are masked to a circle. See web/art/README.md.
 * ================================================================== */

const PORTRAITS = {};
const ABILITY_ICONS = {};

/* The page is a view over the engine and holds no rules of its own. */

const stage = document.getElementById('stage');
const meta = document.getElementById('meta');
const footnote = document.getElementById('footnote');
const fx = document.getElementById('fx');
const tip = document.getElementById('tip');
const drawer = document.getElementById('drawer');

const PANTHEON_ORDER = ['Greek', 'Egyptian', 'Norse', 'Celtic', 'Aztec', 'Japanese', 'Chinese', 'Hindu', 'Mesopotamian', 'Yoruba'];

const PRESETS = {
  Olympians: ['atlas', 'ares', 'zeus', 'gaia', 'hecate', 'poseidon'],
  'Nile Court': ['geb', 'sekhmet', 'anubis', 'bastet', 'isis', 'set'],
  Aesir: ['tyr', 'thor', 'odin', 'heimdall', 'loki', 'skadi'],
};

/** Mercenaries' own split: a Bounty telegraphs enemy picks, a Pit does not. */
const MODES = {
  bounty: { name: 'Bounty', blurb: 'The opposition has already chosen, and you can see it.' },
  pit: { name: 'Fighting Pit', blurb: 'Neither side sees the other’s orders until both commit.' },
};

const GLYPHS = {
  taunt: '◈', shield: '■', 'divine-shield': '◇', immune: '⬟',
  dot: '☠', regen: '✚', stun: '✳', 'attack-buff': '↑',
};

const ORDINALS = ['1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th', '9th'];

const state = {
  phase: 'draft',
  mode: 'bounty',
  party: PRESETS.Olympians.map((id) => ({ id, equippedId: null })),
  foe: [],
  seed: '',
  battle: null,
  orders: {},
  foeOrders: [],
  chosenUid: null,      // whose abilities fill the tray
  pending: null,        // { actorUid, abilityId } awaiting a target
  shownHp: {},
  queue: [],
  nowIndex: -1,
  rounds: [],           // [{ round, lines: [] }] for the drawer
  resolving: false,
  drawerOpen: false,
  unread: false,
};

/** Live element handles, so resolution can animate without re-rendering. */
const ui = { units: new Map(), orbs: new Map() };

/* ---------- small helpers ---------- */

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

const initials = (name) => name.replace(/^The\s+/i, '').split(/[\s-]+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const reducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function artInto(host, id, role, name, map = PORTRAITS) {
  const src = map[id];
  if (src) {
    const img = document.createElement('img');
    img.src = src;
    img.alt = '';
    img.addEventListener('error', () => { img.remove(); host.append(mono(role, name)); }, { once: true });
    host.append(img);
  } else {
    host.append(mono(role, name));
  }
}

function mono(role, name) {
  const node = el('div', `monogram`, initials(name));
  node.setAttribute('aria-hidden', 'true');
  const host = el('div');
  host.className = `ph-${role}`;
  host.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;';
  host.append(node);
  return host;
}

function disc(def, extraClass = 'disc') {
  const box = el('div', `${extraClass} r-${def.role}`);
  artInto(box, def.id, def.role, def.name);
  return box;
}

/* ---------- setup ---------- */

function newRun() {
  state.seed = `run-${Math.floor(Math.random() * 1e9)}`;
  const rng = E.makeRng(`${state.seed}-foe`);
  const pick = (role, n) => rng.shuffled(E.mercsByRole(role)).slice(0, n);
  state.foe = rng.shuffled([...pick('protector', 2), ...pick('fighter', 2), ...pick('caster', 2)])
    .map((def) => ({ id: def.id, equippedId: def.equipment[0]?.id ?? null }));
  state.phase = 'draft';
  state.battle = null;
  state.rounds = [];
  render();
}

const toEntries = (list) => list.map(({ id, equippedId }) => ({ def: E.mercById(id), level: 30, equippedId }));

function beginBattle() {
  state.battle = E.createBattle({
    seed: state.seed,
    partyA: toEntries(state.party),
    partyB: toEntries(state.foe),
  });
  state.phase = 'battle';
  state.rounds = [];
  snapshotHp();
  beginCommandPhase();
}

function beginCommandPhase() {
  state.orders = {};
  state.pending = null;
  state.queue = [];
  state.nowIndex = -1;
  state.foeOrders = E.greedyPolicy(state.battle, 'b');
  state.chosenUid = actableMine()[0]?.uid ?? null;
  render();
}

function snapshotHp() {
  state.shownHp = {};
  for (const side of ['a', 'b']) {
    for (const m of state.battle.sides[side].party) state.shownHp[m.uid] = m.health;
  }
}

/* ---------- engine queries ---------- */

const myBoard = () => E.boardMercs(state.battle, 'a');
const foeBoard = () => E.boardMercs(state.battle, 'b');
const optionsFor = (m) => E.optionsForMerc(state.battle, 'a', m);
const actableMine = () => myBoard().filter((m) => optionsFor(m).length > 0);
const ordersComplete = () => actableMine().every((m) => state.orders[m.uid]);

const myOrderList = () => actableMine().filter((m) => state.orders[m.uid]).map((m) => ({
  actorUid: m.uid,
  abilityId: state.orders[m.uid].abilityId,
  ...(state.orders[m.uid].targetUid !== undefined ? { targetUid: state.orders[m.uid].targetUid } : {}),
}));

/** The resolver's own queue, tie-breaks included, for the orders so far. */
function previewQueue() {
  const orders = { a: myOrderList(), b: state.mode === 'bounty' ? state.foeOrders : [] };
  if (orders.a.length === 0 && orders.b.length === 0) return [];
  return E.buildQueue(state.battle, orders, E.roundRng(state.battle.seed, state.battle.round + 1));
}

function forecast(actor, ability, target) {
  let raw = 0;
  for (const eff of ability.effects) {
    if (eff.kind === 'damage') raw += E.rawDamage(actor, eff.damage);
    else if (eff.kind === 'multi-hit') raw += E.rawDamage(actor, eff.damage) * eff.hits;
    else if (eff.kind === 'drain' || eff.kind === 'execute') raw += E.rawDamage(actor, eff.damage);
  }
  if (raw === 0) return null;
  const bonus = target ? E.hasRoleBonus(actor.role, target.role) : false;
  return { amount: bonus ? raw * E.ROLE_BONUS_MULTIPLIER : raw, raw, bonus };
}

const needsTarget = (a) => a.targeting === 'enemy' || a.targeting === 'ally';

/* ---------- tooltip ---------- */

/**
 * `below` is for anchors inside the tray: opening upward from there would
 * cover the enemy rank, which is exactly where the next click has to land.
 * Nothing opens at all while a target is pending - the board has to be clear.
 */
function showTip(anchor, build, below = false) {
  if (state.pending || state.resolving) return;
  tip.replaceChildren();
  build(tip);
  tip.hidden = false;
  const a = anchor.getBoundingClientRect();
  const t = tip.getBoundingClientRect();

  let left = a.left + a.width / 2 - t.width / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - t.width - 8));

  let top = below ? a.bottom + 10 : a.top - t.height - 10;
  if (top + t.height > window.innerHeight - 8) top = a.top - t.height - 10;
  if (top < 8) top = a.bottom + 10;

  tip.style.left = `${left}px`;
  tip.style.top = `${top}px`;
  tip.classList.add('on');
}

function hideTip() {
  tip.classList.remove('on');
  tip.hidden = true;
}

function abilityTip(host, merc, ability, target) {
  const head = el('div', 'tip-head');
  head.append(el('span', 'tip-name', ability.name));
  head.append(el('span', 'tip-speed tnum', `speed ${ability.speed}`));
  host.append(head);
  host.append(el('div', 'tip-text', ability.text));

  const metaRow = el('div', 'tip-meta');
  metaRow.append(el('span', null, merc.name));
  metaRow.append(el('span', null, ability.cooldown > 0 ? `cooldown ${ability.cooldown}` : 'no cooldown'));
  metaRow.append(el('span', null, ability.targeting));
  host.append(metaRow);

  const f = forecast(merc, ability, target ?? null);
  if (f) {
    const line = el('div', 'tip-fore');
    if (target) {
      line.append(document.createTextNode(`vs ${target.name}: `));
      line.append(el('b', null, `${f.amount} damage`));
      if (f.bonus) line.append(document.createTextNode(' '), el('i', null, `×2 — ${merc.role} beats ${target.role}`));
    } else {
      line.append(document.createTextNode(`about ${f.raw}, doubled against `));
      line.append(el('i', null, E.ROLE_COUNTERS[merc.role]));
    }
    host.append(line);
  }
}

function unitTip(host, merc) {
  const head = el('div', 'tip-head');
  head.append(el('span', 'tip-name', merc.name));
  head.append(el('span', 'tip-speed', merc.role));
  host.append(head);
  host.append(el('div', 'tip-text',
    `${merc.pantheon} · ${merc.attack} attack · ${state.shownHp[merc.uid] ?? merc.health} of ${merc.maxHealth} health`));

  if (merc.statuses.length > 0) {
    const metaRow = el('div', 'tip-meta');
    for (const s of merc.statuses) {
      const label = s.kind === 'attack-buff' ? `+${s.magnitude} attack`
        : s.kind === 'shield' ? `shield ${s.magnitude}`
        : s.kind === 'dot' ? `${s.magnitude} damage a round`
        : s.kind === 'regen' ? `${s.magnitude} healing a round`
        : s.kind === 'divine-shield' ? 'next hit negated'
        : s.kind;
      metaRow.append(el('span', null, label));
    }
    host.append(metaRow);
  }

  const beats = E.ROLE_COUNTERS[merc.role];
  host.append(el('div', 'tip-fore', `${merc.role} deals double to ${beats}`));
}

/* ---------- interaction ---------- */

function onUnitClick(merc, side) {
  if (state.resolving) return;
  hideTip();

  if (state.pending) {
    const actor = E.findMerc(state.battle, state.pending.actorUid);
    const ability = E.abilityOf(actor, state.pending.abilityId);
    const wants = ability.targeting === 'enemy' ? 'b' : 'a';
    if (side === wants && merc.alive) {
      state.orders[actor.uid] = { abilityId: ability.id, targetUid: merc.uid };
      state.pending = null;
      state.chosenUid = actableMine().find((m) => !state.orders[m.uid])?.uid ?? null;
      render();
    }
    return;
  }

  if (side !== 'a' || optionsFor(merc).length === 0) return;
  state.chosenUid = merc.uid;
  render();
}

function onOrbClick(merc, ability) {
  hideTip();
  if (needsTarget(ability)) {
    state.pending = { actorUid: merc.uid, abilityId: ability.id };
  } else {
    state.orders[merc.uid] = { abilityId: ability.id };
    state.pending = null;
    state.chosenUid = actableMine().find((m) => !state.orders[m.uid])?.uid ?? null;
  }
  render();
}

/* ---------- animation ---------- */

const centreOf = (elm) => {
  const r = elm.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2, r };
};

function popNumber(uid, text, kind) {
  const handle = ui.units.get(uid);
  if (!handle) return;
  const c = centreOf(handle.medal);
  const node = el('div', `num ${kind}`, text);
  node.style.left = `${c.x}px`;
  node.style.top = `${c.y}px`;
  fx.append(node);
  node.animate(
    [
      { transform: 'translate(-50%, -50%) scale(0.5)', opacity: 0 },
      { transform: 'translate(-50%, -76%) scale(1.18)', opacity: 1, offset: 0.24 },
      { transform: 'translate(-50%, -132%) scale(1)', opacity: 0 },
    ],
    { duration: 950, easing: 'cubic-bezier(0.2,0.8,0.3,1)' },
  ).finished.then(() => node.remove()).catch(() => node.remove());
}

function ripple(uid, colour, size = 120) {
  const handle = ui.units.get(uid);
  if (!handle) return;
  const c = centreOf(handle.medal);
  const node = el('div', 'ripple');
  node.style.color = colour;
  node.style.left = `${c.x}px`;
  node.style.top = `${c.y}px`;
  node.style.width = node.style.height = '20px';
  fx.append(node);
  node.animate(
    [
      { width: '20px', height: '20px', opacity: 0.95 },
      { width: `${size}px`, height: `${size}px`, opacity: 0 },
    ],
    { duration: 520, easing: 'ease-out' },
  ).finished.then(() => node.remove()).catch(() => node.remove());
}

async function lunge(actorUid, targetUid) {
  const a = ui.units.get(actorUid);
  const b = ui.units.get(targetUid);
  if (!a) return;
  if (!b) { await sleep(120); return; }

  const from = centreOf(a.medal);
  const to = centreOf(b.medal);
  const dx = to.x - from.x;
  const dy = to.y - from.y;
  const dist = Math.hypot(dx, dy) || 1;
  const reach = Math.min(dist * 0.52, 62);

  await a.medal.animate(
    [
      { transform: 'translate(0,0) scale(1)' },
      { transform: `translate(${(dx / dist) * -7}px, ${(dy / dist) * -7}px) scale(1.04)`, offset: 0.22 },
      { transform: `translate(${(dx / dist) * reach}px, ${(dy / dist) * reach}px) scale(1.09)`, offset: 0.52 },
      { transform: 'translate(0,0) scale(1)' },
    ],
    { duration: 470, easing: 'cubic-bezier(0.34,0.1,0.2,1)' },
  ).finished.catch(() => {});
}

async function bolt(actorUid, targetUid, colour) {
  const a = ui.units.get(actorUid);
  const b = ui.units.get(targetUid);
  if (!a || !b) { await sleep(120); return; }

  const from = centreOf(a.medal);
  const to = centreOf(b.medal);

  await a.medal.animate(
    [{ transform: 'scale(1)' }, { transform: 'scale(1.09)', offset: 0.4 }, { transform: 'scale(1)' }],
    { duration: 300, easing: 'ease-out' },
  ).finished.catch(() => {});

  const node = el('div', 'bolt');
  node.style.cssText = `left:${from.x}px;top:${from.y}px;width:15px;height:15px;` +
    `background:radial-gradient(circle,#fff 0%,${colour} 55%,transparent 72%);` +
    `box-shadow:0 0 18px ${colour};`;
  fx.append(node);

  await node.animate(
    [
      { left: `${from.x}px`, top: `${from.y}px`, opacity: 0.2, width: '9px', height: '9px' },
      { opacity: 1, offset: 0.2 },
      { left: `${to.x}px`, top: `${to.y}px`, opacity: 1, width: '19px', height: '19px' },
    ],
    { duration: 340, easing: 'cubic-bezier(0.4,0,0.7,0.2)' },
  ).finished.catch(() => {});
  node.remove();
}

async function struck(uid) {
  const handle = ui.units.get(uid);
  if (!handle) return;
  ripple(uid, '#ff9b88', 104);
  handle.medal.animate(
    [
      { transform: 'translate(0,0)' }, { transform: 'translate(-5px,2px)' },
      { transform: 'translate(5px,-2px)' }, { transform: 'translate(-3px,1px)' },
      { transform: 'translate(0,0)' },
    ],
    { duration: 300, easing: 'ease-in-out' },
  );
  handle.art.animate(
    [{ filter: 'brightness(1)' }, { filter: 'brightness(2.6) saturate(0.4)', offset: 0.18 }, { filter: 'brightness(1)' }],
    { duration: 300 },
  );
}

async function perish(uid) {
  const handle = ui.units.get(uid);
  if (!handle) return;
  handle.card.classList.add('dead');
  await handle.medal.animate(
    [
      { transform: 'scale(1) rotate(0deg)', opacity: 1 },
      { transform: 'scale(1.1)', opacity: 1, offset: 0.2 },
      { transform: 'scale(0.82) rotate(-7deg)', opacity: 0.35 },
    ],
    { duration: 520, easing: 'ease-in' },
  ).finished.catch(() => {});
}

function setHp(uid, value) {
  state.shownHp[uid] = value;
  const handle = ui.units.get(uid);
  if (!handle) return;
  handle.hp.textContent = String(value);
  handle.hp.classList.toggle('low', value > 0 && value <= handle.maxHealth * 0.3);
  handle.hp.animate(
    [{ transform: 'scale(1)' }, { transform: 'scale(1.32)', offset: 0.3 }, { transform: 'scale(1)' }],
    { duration: 280, easing: 'ease-out' },
  );
}

function spotlight(uid, on) {
  const handle = ui.units.get(uid);
  if (!handle) return;
  handle.card.classList.toggle('acting', on);
  const bubble = handle.card.querySelector('.bubble');
  if (bubble) bubble.classList.toggle('now', on);
}

/* ---------- resolution ---------- */

async function commit() {
  if (!ordersComplete() || state.resolving) return;

  state.resolving = true;
  state.pending = null;
  hideTip();

  const before = state.battle;
  const orders = { a: myOrderList(), b: state.foeOrders };
  state.queue = E.buildQueue(before, orders, E.roundRng(before.seed, before.round + 1));

  let after;
  try {
    after = E.resolveRound(before, orders);
  } catch (err) {
    state.resolving = false;
    pushRound(before.round + 1, [{ kind: 'denied', message: String(err?.message ?? err) }]);
    render();
    return;
  }

  const roundLog = after.log.slice(before.log.length);

  // Redraw once with every order revealed, then animate against that DOM.
  // Re-rendering per entry would tear out anything mid-flight.
  state.nowIndex = -1;
  render();
  document.querySelector('.arena')?.classList.add('resolving');
  await sleep(reducedMotion() ? 0 : 260);

  let acting = null;
  for (const entry of roundLog) {
    if (entry.kind === 'cast' || entry.kind === 'denied') {
      if (acting) spotlight(acting, false);
      acting = entry.data?.uid ?? null;
      const idx = state.queue.findIndex((q, i) => i > state.nowIndex && q.actorUid === acting);
      if (idx !== -1) state.nowIndex = idx;
      if (acting) spotlight(acting, true);
      narrate(acting, before);
    }
    await playEntry(entry, before);
  }
  if (acting) spotlight(acting, false);

  pushRound(after.round, roundLog);
  state.battle = after;
  snapshotHp();

  await sleep(reducedMotion() ? 0 : 420);
  state.resolving = false;

  if (state.battle.winner !== null) {
    state.phase = 'over';
    render();
  } else {
    beginCommandPhase();
  }
}

async function playEntry(entry, battleForLookup) {
  const d = entry.data ?? {};
  const fast = reducedMotion();
  const wait = (ms) => (fast ? Promise.resolve() : sleep(ms));

  switch (entry.kind) {
    case 'cast': {
      const actor = E.findMerc(battleForLookup, d.uid);
      const order = state.queue.find((q) => q.actorUid === d.uid);
      if (!fast && actor && order?.targetUid && order.targetUid !== d.uid) {
        if (actor.role === 'caster') {
          await bolt(d.uid, order.targetUid, actor.role === 'caster' ? '#7fb2ff' : '#ffcf7f');
        } else {
          await lunge(d.uid, order.targetUid);
        }
      } else if (!fast) {
        const handle = ui.units.get(d.uid);
        handle?.medal.animate(
          [{ transform: 'scale(1)' }, { transform: 'scale(1.1)', offset: 0.4 }, { transform: 'scale(1)' }],
          { duration: 340, easing: 'ease-out' },
        );
        ripple(d.uid, '#ffe08a', 96);
        await wait(300);
      }
      return wait(90);
    }

    case 'damage': {
      const uid = d.target;
      if (!uid) return wait(60);
      if ((d.amount ?? 0) > 0) {
        struck(uid);
        popNumber(uid, `-${d.amount}`, d.roleBonus ? 'crit' : 'dmg');
        setHp(uid, Math.max(0, (state.shownHp[uid] ?? 0) - d.amount));
      } else if ((d.absorbed ?? 0) > 0) {
        ripple(uid, '#9fc4e8', 96);
        popNumber(uid, 'absorbed', 'word');
      }
      return wait(300);
    }

    case 'heal': {
      const uid = d.target;
      if (!uid || !(d.amount > 0)) return wait(60);
      const merc = E.findMerc(battleForLookup, uid);
      ripple(uid, '#86e0ab', 104);
      popNumber(uid, `+${d.amount}`, 'heal');
      setHp(uid, Math.min(merc?.maxHealth ?? Infinity, (state.shownHp[uid] ?? 0) + d.amount));
      return wait(260);
    }

    case 'dot': {
      if (!d.uid || !(d.amount > 0)) return wait(40);
      popNumber(d.uid, `-${d.amount}`, 'dmg');
      setHp(d.uid, Math.max(0, (state.shownHp[d.uid] ?? 0) - d.amount));
      return wait(220);
    }

    case 'death':
      if (d.uid) { setHp(d.uid, 0); await perish(d.uid); }
      return wait(140);

    case 'immune':
    case 'divine-shield': {
      const uid = d.uid ?? d.target;
      if (uid) { ripple(uid, '#9fc4e8', 110); popNumber(uid, 'blocked', 'word'); }
      return wait(250);
    }

    case 'taunt':
      if (d.to) { ripple(d.to, '#c9a227', 108); popNumber(d.to, 'intercept', 'word'); }
      return wait(280);

    case 'denied':
      if (d.uid) popNumber(d.uid, 'denied', 'word');
      return wait(340);

    case 'fizzle':
      if (d.actor) popNumber(d.actor, 'no target', 'word');
      return wait(340);

    case 'status':
      if (d.target) ripple(d.target, '#86e0ab', 78);
      return wait(130);

    case 'revive':
      if (d.target) { ripple(d.target, '#ffe08a', 130); popNumber(d.target, 'returns', 'word'); }
      return wait(400);

    default:
      return wait(50);
  }
}

/** Name the acting god in the tray, in place, as its turn comes up. */
function narrate(uid, battleForLookup) {
  if (!ui.trayHint || !uid) return;
  const step = state.queue[state.nowIndex];
  const actor = E.findMerc(battleForLookup, uid);
  const ability = actor && step ? E.abilityOf(actor, step.abilityId) : null;
  if (!actor || !ability) return;

  const target = step?.targetUid ? E.findMerc(battleForLookup, step.targetUid) : null;
  const aimed = target && target.uid !== uid ? ` → ${target.name}` : '';
  ui.trayHint.textContent =
    `${ORDINALS[state.nowIndex] ?? ''} · ${actor.name} — ${ability.name}` +
    ` (speed ${ability.speed})${aimed}`;
  ui.trayHint.animate(
    [{ opacity: 0.25, transform: 'translateY(3px)' }, { opacity: 1, transform: 'translateY(0)' }],
    { duration: 220, easing: 'ease-out' },
  );
}

function pushRound(round, lines) {
  state.rounds.push({ round, lines });
  if (!state.drawerOpen) state.unread = true;
}

/* ---------- board rendering ---------- */

function bubbleFor(merc, side) {
  const playing = state.queue.length > 0;
  const queue = playing ? state.queue : previewQueue();
  const idx = queue.findIndex((q) => q.actorUid === merc.uid);

  if (idx === -1) {
    if (side === 'b' && state.mode === 'pit' && !playing && merc.alive) {
      return el('div', 'bubble sealed', '?');
    }
    return null;
  }

  // Only a tie that crosses sides is uncertain: same-side ties resolve in the
  // order you committed them. Mercenaries marked the uncertain ones with a
  // question mark, which is what this reproduces.
  const step = queue[idx];
  const contested = queue.some((q, i) =>
    i !== idx && q.speed === step.speed && q.side !== step.side);
  const label = `${ORDINALS[idx] ?? `${idx + 1}th`}${contested ? '?' : ''}`;

  const node = el('div', 'bubble', label);
  if (playing && state.nowIndex > idx) node.classList.add('spent');
  return node;
}

function queuedBadge(merc, side) {
  const isMine = side === 'a';
  const order = isMine ? state.orders[merc.uid] : state.foeOrders.find((o) => o.actorUid === merc.uid);
  if (!order) return null;

  const revealed = isMine || state.mode === 'bounty' || state.queue.length > 0;
  if (!revealed) {
    const sealed = el('div', 'queued theirs sealed', '?');
    sealed.title = 'Order sealed until both sides commit';
    return sealed;
  }

  const ability = E.abilityOf(merc, order.abilityId);
  const badge = el('div', `queued${isMine ? '' : ' theirs'}`);
  const src = ABILITY_ICONS[ability.id];
  if (src) {
    const img = document.createElement('img');
    img.src = src;
    img.alt = '';
    img.addEventListener('error', () => { img.remove(); badge.textContent = String(ability.speed); }, { once: true });
    badge.append(img);
  } else {
    badge.textContent = String(ability.speed);
  }

  const target = order.targetUid ? E.findMerc(state.battle, order.targetUid) : null;
  badge.addEventListener('mouseenter', () => showTip(badge, (host) => abilityTip(host, merc, ability, target)));
  badge.addEventListener('mouseleave', hideTip);
  return badge;
}

function unitNode(merc, side) {
  const isMine = side === 'a';
  const interactive = !state.resolving && (isMine || state.pending);
  const card = el(interactive ? 'button' : 'div', `unit r-${merc.role}`);
  if (interactive) card.type = 'button';
  if (!merc.alive) card.classList.add('dead');
  if (state.chosenUid === merc.uid) card.classList.add('chosen');

  if (state.pending && !state.resolving) {
    const actor = E.findMerc(state.battle, state.pending.actorUid);
    const ability = E.abilityOf(actor, state.pending.abilityId);
    const wants = ability.targeting === 'enemy' ? 'b' : 'a';
    if (side === wants && merc.alive) card.classList.add('targetable');
  } else if (isMine && merc.alive && optionsFor(merc).length > 0 && !state.resolving) {
    card.classList.add('pickable');
  }

  const bubble = bubbleFor(merc, side);
  if (bubble) card.append(bubble);

  const medal = el('div', 'medal');
  const art = el('div', 'medal-art');
  artInto(art, merc.defId, merc.role, merc.name);
  medal.append(art);
  medal.append(el('div', 'medal-ring'));

  const hp = state.shownHp[merc.uid] ?? merc.health;
  medal.append(el('div', 'pip pip-atk tnum', String(merc.attack)));
  const hpPip = el('div', 'pip pip-hp tnum', String(hp));
  if (hp > 0 && hp <= merc.maxHealth * 0.3) hpPip.classList.add('low');
  medal.append(hpPip);

  const badge = queuedBadge(merc, side);
  if (badge) medal.append(badge);
  card.append(medal);

  card.append(el('div', 'nameplate', merc.name));

  const glyphs = el('div', 'glyphs');
  for (const s of merc.statuses) {
    const g = el('div', `glyph g-${s.kind}`, GLYPHS[s.kind] ?? '•');
    g.title = `${s.kind}${s.magnitude ? ` ${s.magnitude}` : ''}`;
    glyphs.append(g);
  }
  card.append(glyphs);

  if (interactive) card.addEventListener('click', () => onUnitClick(merc, side));
  card.addEventListener('mouseenter', () => { if (!state.resolving) showTip(medal, (host) => unitTip(host, merc)); });
  card.addEventListener('mouseleave', hideTip);

  ui.units.set(merc.uid, { card, medal, art, hp: hpPip, maxHealth: merc.maxHealth });
  return card;
}

function rankNode(side) {
  const rank = el('div', `rank ${side === 'a' ? 'mine' : 'enemy'}`);
  for (const uid of state.battle.sides[side].board) {
    if (uid === null) {
      const gap = el('div', 'unit slot-empty');
      gap.append(el('div', 'medal'));
      rank.append(gap);
      continue;
    }
    rank.append(unitNode(E.findMerc(state.battle, uid), side));
  }
  return rank;
}

/* ---------- the tray ---------- */

function trayNode() {
  const tray = el('div', 'tray');
  const merc = state.chosenUid ? E.findMerc(state.battle, state.chosenUid) : null;

  if (state.resolving) {
    tray.classList.add('waiting');
    const hint = el('div', 'tray-hint', 'Resolving in speed order…');
    ui.trayHint = hint;
    tray.append(hint);
    return tray;
  }

  if (!merc || optionsFor(merc).length === 0) {
    tray.classList.add('waiting');
    tray.append(el('div', 'tray-hint', ordersComplete()
      ? 'Every order is in. Press Ready.'
      : 'Choose one of your gods to see its abilities.'));
    return tray;
  }

  const legal = new Set(optionsFor(merc).map((o) => o.abilityId));

  for (const ability of merc.abilities) {
    const wrap = el('div', 'orb-wrap');
    const orb = el('button', 'orb');
    orb.type = 'button';
    const ready = legal.has(ability.id);
    orb.disabled = !ready;
    if (ready) orb.classList.add('ready');
    orb.setAttribute('aria-pressed',
      String(state.pending?.abilityId === ability.id && state.pending?.actorUid === merc.uid));
    orb.setAttribute('aria-label', `${ability.name}, speed ${ability.speed}`);

    const src = ABILITY_ICONS[ability.id];
    if (src) {
      const img = document.createElement('img');
      img.src = src;
      img.alt = '';
      img.addEventListener('error', () => { img.remove(); orb.append(el('span', 'orb-mark', '✦')); }, { once: true });
      orb.append(img);
    } else {
      orb.append(el('span', 'orb-mark', '✦'));
    }

    const cd = merc.cooldowns[ability.id] ?? 0;
    if (cd > 0) orb.append(el('div', 'cd tnum', String(cd)));

    orb.addEventListener('click', () => { if (ready) onOrbClick(merc, ability); });
    const openTip = () => showTip(orb, (host) => abilityTip(host, merc, ability, null), true);
    orb.addEventListener('mouseenter', openTip);
    orb.addEventListener('mouseleave', hideTip);
    orb.addEventListener('focus', openTip);
    orb.addEventListener('blur', hideTip);

    wrap.append(orb);
    const speed = el('div', 'orb-speed tnum', String(ability.speed));
    if (!ready) speed.classList.add('muted');
    wrap.append(speed);
    tray.append(wrap);
    ui.orbs.set(ability.id, orb);
  }
  return tray;
}

/* ---------- edge strips ---------- */

function historyStrip() {
  const strip = el('button', 'strip history-strip');
  strip.type = 'button';
  strip.title = 'Battle history';
  if (state.drawerOpen) strip.classList.add('open');
  if (state.unread) strip.classList.add('unread');
  strip.append(el('div', 'history-glyph', '☷'));
  strip.append(el('div', 'history-label', 'History'));
  strip.addEventListener('click', () => {
    state.drawerOpen = !state.drawerOpen;
    if (state.drawerOpen) state.unread = false;
    renderDrawer();
    render();
  });
  return strip;
}

function flankNode() {
  const flank = el('div', 'flank');

  const ready = el('button', 'ready-btn', state.resolving ? '…' : 'Ready');
  ready.type = 'button';
  ready.disabled = state.resolving || !ordersComplete();
  ready.addEventListener('click', commit);
  flank.append(ready);

  const bench = el('div', 'strip bench-strip');
  bench.append(el('div', 'bench-title', 'Bench'));
  const party = state.battle.sides.a.party;
  const onBoard = new Set(state.battle.sides.a.board.filter(Boolean));
  for (const merc of party) {
    if (onBoard.has(merc.uid)) continue;
    const def = E.mercById(merc.defId);
    const medal = el('div', `bench-medal r-${merc.role}`);
    artInto(medal, def.id, merc.role, merc.name);
    if (!merc.alive) medal.classList.add('fallen');
    medal.title = `${merc.name} · ${merc.alive ? `${merc.health}/${merc.maxHealth}` : 'fallen'}`;
    bench.append(medal);
  }
  flank.append(bench);
  return flank;
}

/* ---------- drawer ---------- */

function renderDrawer() {
  drawer.replaceChildren();
  drawer.hidden = !state.drawerOpen;
  drawer.classList.toggle('open', state.drawerOpen);
  if (!state.drawerOpen) return;

  const head = el('div', 'drawer-head');
  head.append(el('span', 'drawer-title', 'Battle history'));
  const close = el('button', 'icon-btn', '×');
  close.type = 'button';
  close.addEventListener('click', () => { state.drawerOpen = false; renderDrawer(); render(); });
  head.append(close);
  drawer.append(head);

  if (state.rounds.length === 0) {
    drawer.append(el('div', 'tray-hint', 'Nothing has happened yet.'));
    return;
  }

  for (const block of [...state.rounds].reverse()) {
    const wrap = el('div', 'round-block');
    wrap.append(el('div', 'round-tag', `Round ${block.round}`));
    const list = el('ul', 'round-lines');
    for (const line of block.lines) {
      list.append(el('li', `c-${line.kind}`, line.message));
    }
    wrap.append(list);
    drawer.append(wrap);
  }
}

/* ---------- screens ---------- */

function renderBattle() {
  ui.units.clear();
  ui.orbs.clear();
  const wrap = el('div');

  const table = el('div', 'table');
  table.append(historyStrip());

  const arena = el('div', 'arena');
  arena.append(rankNode('b'));
  arena.append(trayNode());
  arena.append(rankNode('a'));
  table.append(arena);

  table.append(flankNode());
  wrap.append(table);

  const under = el('div', 'under-table');
  const note = el('div', 'turn-note');
  const actable = actableMine();
  const given = actable.filter((m) => state.orders[m.uid]).length;
  note.textContent = state.resolving ? 'Resolving…'
    : state.pending ? 'Now click a target on the board.'
    : `Round ${state.battle.round + 1} · ${given} of ${actable.length} orders given`;
  under.append(note);

  const actions = el('div', 'mini-actions');
  const toggle = el('div', 'mode-toggle');
  for (const [key, cfg] of Object.entries(MODES)) {
    const b = el('button', null, cfg.name);
    b.type = 'button';
    b.title = cfg.blurb;
    b.disabled = state.resolving;
    b.setAttribute('aria-pressed', String(state.mode === key));
    b.addEventListener('click', () => { state.mode = key; render(); });
    toggle.append(b);
  }
  actions.append(toggle);

  const suggest = el('button', null, 'Suggest');
  suggest.type = 'button';
  suggest.disabled = state.resolving;
  suggest.title = 'Fill your orders with the same policy the opponent uses';
  suggest.addEventListener('click', () => {
    for (const o of E.greedyPolicy(state.battle, 'a')) {
      state.orders[o.actorUid] = o.targetUid === undefined
        ? { abilityId: o.abilityId } : { abilityId: o.abilityId, targetUid: o.targetUid };
    }
    state.pending = null;
    state.chosenUid = null;
    render();
  });

  const clear = el('button', null, 'Clear');
  clear.type = 'button';
  clear.disabled = state.resolving || given === 0;
  clear.addEventListener('click', () => {
    state.orders = {};
    state.pending = null;
    state.chosenUid = actableMine()[0]?.uid ?? null;
    render();
  });

  actions.append(suggest, clear);
  under.append(actions);
  wrap.append(under);
  return wrap;
}

function renderVerdict() {
  ui.units.clear();
  const wrap = el('div');
  const winner = state.battle.winner;

  const verdict = el('div', `verdict${winner === 'b' ? ' lost' : winner === 'draw' ? ' drawn' : ''}`);
  verdict.append(el('h2', null,
    winner === 'a' ? 'The field is yours' : winner === 'b' ? 'Your pantheon falls' : 'Neither side yields'));
  const mine = state.battle.sides.a.party.filter((m) => m.alive).length;
  const theirs = state.battle.sides.b.party.filter((m) => m.alive).length;
  verdict.append(el('p', null,
    `Settled in ${state.battle.round} rounds. ${mine} of your six still standing, ${theirs} of theirs.`));

  const actions = el('div', 'verdict-actions');
  const again = el('button', 'btn-primary', 'New opposition');
  again.type = 'button';
  again.addEventListener('click', newRun);
  const redraft = el('button', null, 'Redraft against the same six');
  redraft.type = 'button';
  redraft.addEventListener('click', () => { state.phase = 'draft'; render(); });
  const hist = el('button', null, 'Read the history');
  hist.type = 'button';
  hist.addEventListener('click', () => { state.drawerOpen = true; state.unread = false; renderDrawer(); render(); });
  actions.append(again, redraft, hist);
  verdict.append(actions);
  wrap.append(verdict);

  const table = el('div', 'table');
  table.append(historyStrip());
  const arena = el('div', 'arena');
  arena.append(rankNode('b'));
  arena.append(rankNode('a'));
  table.append(arena);
  table.append(el('div'));
  wrap.append(table);
  return wrap;
}

function renderDraft() {
  const wrap = el('div', 'draft-grid');
  const left = el('div');
  left.append(el('p', 'eyebrow', 'Assemble a pantheon of six'));

  const legend = el('div', 'legend');
  for (const [role, beats] of Object.entries(E.ROLE_COUNTERS)) {
    const item = el('div', `legend-item l-${role}`);
    item.append(el('span', 'legend-dot'));
    item.append(el('span', null, role));
    item.append(el('span', 'legend-note', `doubles vs ${beats}`));
    legend.append(item);
  }
  left.append(legend);

  const chosen = new Set(state.party.map((p) => p.id));
  const byPantheon = new Map();
  for (const def of E.ROSTER) {
    if (!byPantheon.has(def.pantheon)) byPantheon.set(def.pantheon, []);
    byPantheon.get(def.pantheon).push(def);
  }

  for (const pantheon of [...byPantheon.keys()].sort(
    (x, y) => PANTHEON_ORDER.indexOf(x) - PANTHEON_ORDER.indexOf(y))) {
    const block = el('div', 'pantheon-block');
    block.append(el('h3', 'pantheon-name', pantheon));
    const row = el('div', 'god-row');

    for (const def of byPantheon.get(pantheon)) {
      const btn = el('button', 'god-pick');
      btn.type = 'button';
      const picked = chosen.has(def.id);
      btn.setAttribute('aria-pressed', String(picked));
      btn.disabled = !picked && state.party.length >= 6;
      if (btn.disabled) btn.title = 'Remove one of your six to pick this god';
      btn.append(disc(def));

      const info = el('div');
      info.append(el('div', 'god-pick-name', def.name));
      const stats = el('div', 'god-pick-stats');
      const atk = el('span', 'tnum');
      atk.append(el('b', null, String(E.attackAtLevel(def, 30))), document.createTextNode(' atk'));
      const hp = el('span', 'tnum');
      hp.append(el('b', null, String(E.healthAtLevel(def, 30))), document.createTextNode(' hp'));
      stats.append(atk, hp);
      info.append(stats);
      btn.append(info);

      btn.addEventListener('click', () => {
        if (picked) state.party = state.party.filter((p) => p.id !== def.id);
        else if (state.party.length < 6) state.party.push({ id: def.id, equippedId: null });
        render();
      });
      row.append(btn);
    }
    block.append(row);
    left.append(block);
  }

  const panel = el('aside', 'roster-panel');
  panel.append(el('p', 'eyebrow', `Your pantheon · ${state.party.length}/6`));

  const presets = el('div', 'presets');
  for (const [name, ids] of Object.entries(PRESETS)) {
    const b = el('button', null, name);
    b.type = 'button';
    b.addEventListener('click', () => { state.party = ids.map((id) => ({ id, equippedId: null })); render(); });
    presets.append(b);
  }
  const randomBtn = el('button', null, 'Random');
  randomBtn.type = 'button';
  randomBtn.addEventListener('click', () => {
    const rng = E.makeRng(`draft-${Math.random()}`);
    const pick = (role, n) => rng.shuffled(E.mercsByRole(role)).slice(0, n);
    state.party = rng.shuffled([...pick('protector', 2), ...pick('fighter', 2), ...pick('caster', 2)])
      .map((def) => ({ id: def.id, equippedId: null }));
    render();
  });
  presets.append(randomBtn);
  panel.append(presets);

  const list = el('ul', 'slot-list');
  for (let i = 0; i < 6; i++) {
    if (i === 0) list.append(el('li', 'board-divider', 'On the board'));
    if (i === 3) list.append(el('li', 'board-divider', 'In reserve'));

    const entry = state.party[i];
    const li = el('li', `party-slot${i >= 3 ? ' bench' : ''}`);
    li.append(el('span', 'slot-index tnum', String(i + 1)));
    if (!entry) {
      li.append(el('span', 'slot-empty', 'empty'), el('span'));
      list.append(li);
      continue;
    }

    const def = E.mercById(entry.id);
    li.append(disc(def));
    li.append(el('div', 'slot-name-d', def.name));

    const actions = el('div', 'slot-actions');
    const up = el('button', 'icon-btn', '↑');
    up.type = 'button';
    up.title = 'Move earlier';
    up.disabled = i === 0;
    up.addEventListener('click', () => {
      const p = state.party;
      [p[i - 1], p[i]] = [p[i], p[i - 1]];
      render();
    });
    const drop = el('button', 'icon-btn', '×');
    drop.type = 'button';
    drop.title = 'Remove';
    drop.addEventListener('click', () => {
      state.party = state.party.filter((p) => p.id !== entry.id);
      render();
    });
    actions.append(up, drop);
    li.append(actions);
    list.append(li);

    if (def.equipment.length > 0) {
      const equip = el('li', 'equip-row');
      const none = el('button', 'equip-btn', 'bare');
      none.type = 'button';
      none.setAttribute('aria-pressed', String(entry.equippedId === null));
      none.addEventListener('click', () => { entry.equippedId = null; render(); });
      equip.append(none);
      for (const item of def.equipment) {
        const b = el('button', 'equip-btn', item.name);
        b.type = 'button';
        b.title = item.text;
        b.setAttribute('aria-pressed', String(entry.equippedId === item.id));
        b.addEventListener('click', () => { entry.equippedId = item.id; render(); });
        equip.append(b);
      }
      list.append(equip);
    }
  }
  panel.append(list);

  const go = el('button', 'btn-primary',
    state.party.length === 6 ? 'Take the field' : `Choose ${6 - state.party.length} more`);
  go.type = 'button';
  go.style.width = '100%';
  go.disabled = state.party.length !== 6;
  go.addEventListener('click', beginBattle);
  panel.append(go);

  const opp = el('div', 'opposition');
  opp.append(el('p', 'eyebrow', 'You face'));
  const oppList = el('ul', 'opp-list');
  for (const { id } of state.foe) {
    const def = E.mercById(id);
    const row = el('li', 'opp-row');
    row.append(disc(def), el('span', 'nm', def.name));
    oppList.append(row);
  }
  opp.append(oppList);
  panel.append(opp);

  wrap.append(left, panel);
  return wrap;
}

/* ---------- top level ---------- */

function render() {
  stage.replaceChildren(
    state.phase === 'draft' ? renderDraft()
      : state.phase === 'over' ? renderVerdict()
      : renderBattle(),
  );

  meta.replaceChildren();
  if (state.phase === 'draft') {
    meta.append(el('div', null, `${E.ROSTER.length} gods · ${new Set(E.ROSTER.map((d) => d.pantheon)).size} pantheons`));
  } else {
    const line = el('div');
    line.append(document.createTextNode('round '));
    line.append(el('b', 'tnum', String(state.battle.round + (state.phase === 'over' ? 0 : 1))));
    line.append(document.createTextNode(` · ${MODES[state.mode].name}`));
    meta.append(line);
  }

  footnote.replaceChildren();
  footnote.append(el('b', null, state.phase === 'draft' ? 'How it works. ' : `${MODES[state.mode].name}. `));
  footnote.append(document.createTextNode(state.phase === 'draft'
    ? 'Each round every god on the board takes one ability, then everything resolves from the ' +
      'lowest speed to the highest — a fast kill denies a slow ability outright. The ring ' +
      'colour is the role: Protector doubles against Fighter, Fighter against Caster, Caster ' +
      'against Protector. Cooldowns start spent, so round one is the narrowest of the fight.'
    : `${MODES[state.mode].blurb} The bubble above each god is its place in the resolution ` +
      'order; a question mark means it shares a speed with something else, so the tie breaks at ' +
      'random. The number under each orb is that ability’s speed.'));
}

window.claude?.hot?.snapshot?.(() => ({
  party: state.party, foe: state.foe, seed: state.seed, mode: state.mode,
}));

function start(restored) {
  if (restored?.party?.length === 6 && restored?.foe?.length === 6) {
    state.party = restored.party;
    state.foe = restored.foe;
    state.seed = restored.seed ?? `run-${Math.floor(Math.random() * 1e9)}`;
    if (restored.mode in MODES) state.mode = restored.mode;
    state.phase = 'draft';
    render();
    return;
  }
  newRun();
}

if (window.claude?.hot?.ready) window.claude.hot.ready(start);
else start(window.claude?.hot?.data ?? {});
</script>
